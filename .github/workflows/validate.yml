name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Syntax checks
        run: |
          python -m py_compile scripts/run_dsh_session.py
          bash -n scripts/run-dsh-agent.sh scripts/install.sh
